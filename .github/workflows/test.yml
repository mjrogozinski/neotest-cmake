name: Tests
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: v0.11.5
          neovim: true
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake
      - name: Install test dependencies
        run: |
          mkdir -p /tmp/neotest-deps /tmp/cpp-parser/parser
          git clone --depth 1 https://github.com/nvim-neotest/neotest /tmp/neotest-deps/neotest
          git clone --depth 1 https://github.com/nvim-neotest/nvim-nio /tmp/neotest-deps/nvim-nio
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim /tmp/neotest-deps/plenary.nvim
          git clone --depth 1 --branch v0.23.4 https://github.com/tree-sitter/tree-sitter-cpp /tmp/tree-sitter-cpp
          cc -O2 -fPIC -I/tmp/tree-sitter-cpp/src -c /tmp/tree-sitter-cpp/src/parser.c -o /tmp/parser.o
          cc -O2 -fPIC -I/tmp/tree-sitter-cpp/src -c /tmp/tree-sitter-cpp/src/scanner.c -o /tmp/scanner.o
          cc -shared /tmp/parser.o /tmp/scanner.o -o /tmp/cpp-parser/parser/cpp.so
      - run: make test
        env:
          NEOTEST_DEPS: /tmp/neotest-deps
          CPP_PARSER_DIR: /tmp/cpp-parser
